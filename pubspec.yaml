name: waifuvault
description: A futuristic private anime gallery for images and short videos.
publish_to: 'none'

version: 1.3.1+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  palette_generator: ^0.3.3+4
  path_provider: ^2.1.4
  path: ^1.9.0
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
