name: Build WaifuVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Create Android project files
        run: flutter create --platforms=android --project-name waifuvault .

      - name: Install dependencies
        run: flutter pub get

      - name: Set app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="waifuvault"', 'android:label="WaifuVault"')
          text = text.replace('android:label="waifuvault"', 'android:label="WaifuVault"')
          manifest.write_text(text)
          PY

      - name: Generate branding assets
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaifuVault-APK
          path: build/app/outputs/flutter-apk/app-release.apk
